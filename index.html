<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Dashboard</title>
  <style>
    :root {
      --bg-color: #0e1117;
      --card-bg: #161b22;
      --input-bg: #0d1117;
      --border-color: #30363d;
      --primary-color: #00e676;
      --text-color: #c9d1d9;
      --text-header: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .brand { font-size: 22px; font-weight: bold; color: #ffffff; }
    .brand span { color: var(--primary-color); }
    .status-badge {
      font-size: 12px;
      background: rgba(0, 230, 118, 0.15);
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .hero { text-align: center; margin-bottom: 24px; }
    .hero h1 { font-size: 20px; color: var(--text-header); margin-bottom: 8px; }
    .hero p { font-size: 13px; color: #8b949e; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
    .tab-btn {
      flex: 1; padding: 10px; background: var(--card-bg);
      border: 1px solid var(--border-color); color: #8b949e;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      text-align: center; cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary-color); color: #000000;
      border-color: var(--primary-color);
    }
    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 18px; margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px; font-weight: 700; color: var(--text-header);
      margin-bottom: 8px; margin-top: 12px;
    }
    .card-title:first-child { margin-top: 0; }
    .input-group { position: relative; }
    .input-box {
      width: 100%; padding: 12px 14px; background: var(--input-bg);
      border: 1px solid var(--border-color); border-radius: 8px;
      color: #e6edf3; font-size: 12px; font-family: monospace; outline: none;
    }
    .copy-btn {
      position: absolute; right: 6px; top: 6px;
      background: var(--border-color); color: #ffffff;
      border: none; padding: 6px 12px; border-radius: 6px;
      font-size: 11px; cursor: pointer; font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">Proxy <span>Dashboard</span></div>
    <div class="status-badge">RUNNING 100%</div>
  </div>

  <div class="hero">
    <h1>Proxy Multi-Protocol & Bug Checker</h1>
    <p>Status Core: <span style="color:var(--primary-color);">Online</span></p>
  </div>

  <div class="nav-tabs">
    <div class="tab-btn">Cek Bug</div>
    <div class="tab-btn active">Direct Link</div>
    <div class="tab-btn">Buat Akun</div>
    <div class="tab-btn">Converter</div>
  </div>

  <div class="card">
    <div class="card-title">VLESS CONFIG LINK</div>
    <div class="input-group">
      <input type="text" id="vless" class="input-box" readonly>
      <button class="copy-btn" onclick="copyToClipboard('vless')">Copy</button>
    </div>

    <div class="card-title">VMESS CONFIG LINK</div>
    <div class="input-group">
      <input type="text" id="vmess" class="input-box" readonly>
      <button class="copy-btn" onclick="copyToClipboard('vmess')">Copy</button>
    </div>

    <div class="card-title">TROJAN CONFIG LINK</div>
    <div class="input-group">
      <input type="text" id="trojan" class="input-box" readonly>
      <button class="copy-btn" onclick="copyToClipboard('trojan')">Copy</button>
    </div>
  </div>

  <script>
    const host = window.location.host;
    const uuid = "d3b07384-d113-424a-a513-33e9d0b61e2f";

    // VLESS Link
    document.getElementById('vless').value = `vless://${uuid}@${host}:443?path=%2Fvless&security=tls&encryption=none&type=ws#VLESS-Railway`;

    // VMESS Link
    const vmessObj = {
      v: "2", ps: "VMESS-Railway", add: host, port: "443", id: uuid,
      aid: "0", scy: "auto", net: "ws", type: "none", host: host, path: "/vmess", tls: "tls"
    };
    document.getElementById('vmess').value = `vmess://${btoa(JSON.stringify(vmessObj))}`;

    // TROJAN Link
    document.getElementById('trojan').value = `trojan://${uuid}@${host}:443?path=%2Ftrojan&security=tls&type=ws#Trojan-Railway`;

    function copyToClipboard(id) {
      const copyText = document.getElementById(id);
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Link tersalin ke clipboard!");
    }
  </script>
</body>
</html>
